const STATUS_META = {
  done:    { label: '認定・受賞確定', cls: 's-done' },
  active:  { label: '提出済み・審査中', cls: 's-active' },
  working: { label: '対応中', cls: 's-working' },
  blocker: { label: 'ブロッカーあり', cls: 's-blocker' },
  skip:    { label: '見送り', cls: 's-skip' },
  unknown: { label: '未定', cls: 's-unknown' },
};

const GROUPS = [
  { key: 'done',    label: '✦ 認定・受賞確定' },
  { key: 'active',  label: '◎ 提出済み・審査中' },
  { key: 'working', label: '○ 対応中' },
  { key: 'blocker', label: '⚠ ブロッカーあり' },
  { key: 'skip',    label: '— 見送り' },
  { key: 'unknown', label: '? 未定' },
];

function nl2br(str) {
  return str ? str.replace(/\n/g, '<br>') : '';
}

function renderTimeline(tl) {
  if (!tl || !tl.length) return '';
  return tl.map(s => {
    let cls = 'tl-step';
    if (s.done) cls += ' done';
    if (s.current) cls += ' current';
    if (s.working) cls += ' working';
    if (s.blocker) cls += ' blocker';
    if (s.next) cls += ' next';
    const datePart = s.date ? `<div class="tl-date">${s.date}</div>` : '';
    const phaseText = s.phase.replace(/\n/g, '<br>');
    let chips = '';
    if (s.current && !s.done) chips += `<span class="current-chip">現在</span>`;
    if (s.next) chips += `<span class="next-chip">次のステップ</span>`;
    const subPart = s.sub ? `<div class="tl-sub">${s.sub}</div>` : '';
    return `<div class="${cls}"><div class="tl-dot"></div>${datePart}<div class="tl-phase">${phaseText}${chips}</div>${subPart}</div>`;
  }).join('');
}

function getNextAction(p) {
  if (!p.timeline || !p.timeline.length) return null;
  const nextStep = p.timeline.find(s => s.next);
  if (nextStep) return { phase: nextStep.phase, date: nextStep.date || null };
  // fallback: first non-done step
  const pending = p.timeline.find(s => !s.done && !s.current);
  if (pending) return { phase: pending.phase, date: pending.date || null };
  return null;
}

function buildCover() {
  const body = document.getElementById('cover-body');
  let html = '';
  GROUPS.forEach(g => {
    const items = PITCHES.filter(p => p.status === g.key);
    if (!items.length) return;
    html += `<tr class="group-row"><td colspan="5">${g.label}　<span style="font-weight:400;opacity:0.7">${items.length}件</span></td></tr>`;
    items.forEach(p => {
      const next = getNextAction(p);
      let nextHtml = '<span class="col-next-empty">—</span>';
      if (next) {
        const dateStr = next.date ? `<span style="font-size:0.65rem;color:var(--text-3);display:block;margin-top:0.1rem">${next.date}</span>` : '';
        nextHtml = `<span class="next-label">NEXT</span>${next.phase.replace(/\n/g,'<br>')}${dateStr}`;
      }
      const dl = (p.status !== 'skip' && p.status !== 'unknown' && p.deadline) ? p.deadline : '—';
      html += `
        <tr class="s-${p.status}" onclick="showDetail(${p.id})">
          <td class="col-name">
            <div class="col-name-inner">
              <span class="col-num">${p.num}</span>
              <div>
                <div class="col-name-text">${p.name}${p.ceo ? '<span class="ceo-badge"><span class="ceo-emoji">🦄</span>CEO</span>' : ''}</div>
                <span class="col-status-badge">${p.statusLabel}</span>
              </div>
            </div>
          </td>
          <td class="col-current">${nl2br(p.current)}</td>
          <td class="col-next">${nextHtml}</td>
          <td class="col-deadline">${dl}</td>
          <td class="row-arrow">→</td>
        </tr>
      `;
    });
  });
  body.innerHTML = html;
}

function showDetail(id) {
  const p = PITCHES.find(x => x.id === id);
  const sm = STATUS_META[p.status];

  let timelineHtml = '';
  if (p.timeline && p.timeline.length) {
    timelineHtml = `
      <div class="timeline-wrap">
        <div class="section-label">選考フロー・スケジュール</div>
        <div class="timeline">${renderTimeline(p.timeline)}</div>
      </div>
    `;
  }

  const noteCards = [];
  if (p.winAngle) noteCards.push({ label: '勝ち筋 / Win Angle', body: p.winAngle });
  if (p.risk) noteCards.push({ label: 'リスク・留意事項', body: p.risk });
  if (p.target) noteCards.push({ label: '対象 / Target', body: p.target });
  const notesHtml = noteCards.length ? `
    <div class="section-label">補足情報</div>
    <div class="notes-grid">${noteCards.map(c => `
      <div class="note-card">
        <div class="note-card-label">${c.label}</div>
        <div class="note-card-body">${nl2br(c.body)}</div>
      </div>`).join('')}
    </div>
  ` : '';

  const deadlineHtml = (p.status !== 'skip' && p.status !== 'unknown' && p.deadline)
    ? `<span class="status-deadline">締切：${p.deadline}</span>` : '';

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-header">
      <div class="detail-breadcrumb">${sm.label}</div>
      <div class="detail-title">${p.name}</div>
      ${p.org ? `<div class="detail-org">${p.org}</div>` : ''}
    </div>
    <div class="status-card ${sm.cls}">
      <span class="status-badge">${p.statusLabel}</span>
      <span class="status-current">${nl2br(p.current)}</span>
      ${deadlineHtml}
    </div>
    ${timelineHtml}
    ${notesHtml}
    ${(!p.timeline || !p.timeline.length) && !noteCards.length ? `
      <div class="empty-state"><div class="icon">—</div><p>詳細情報なし</p></div>
    ` : ''}
  `;

  document.body.classList.add('show-detail');
  window.scrollTo(0, 0);
}

function showCover() {
  document.body.classList.remove('show-detail');
  window.scrollTo(0, 0);
}

function init() {
  const d = new Date();
  document.getElementById('today-date').textContent =
    `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 時点`;
  buildCover();
}
