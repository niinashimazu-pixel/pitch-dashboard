<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アワード進捗 — 次の灯</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=BIZ+UDPMincho:wght@400;700&display=swap">
<style>
:root {
  --bg: #F2F4F2;
  --surface: #FFFFFF;
  --surface2: #EAEEEA;
  --ink: #141C17;
  --ink-mid: #445244;
  --ink-muted: #6B7D6A;
  --ink-faint: #9AAA98;
  --accent: #0B3D30;
  --accent-light: #DFF0EB;
  --flame: #D96B10;
  --flame-bg: #FEF0E3;
  --flame-border: #F0B870;
  --border: #D4DDD4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1410; --surface: #172018; --surface2: #1E2A1E;
    --ink: #E2EBE2; --ink-mid: #9AAA98; --ink-muted: #6A806A; --ink-faint: #3A503A;
    --accent: #2FAA80; --accent-light: #0A2820;
    --flame: #E88030; --flame-bg: #281808; --flame-border: #6A3A10;
    --border: #283A28;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1410; --surface: #172018; --surface2: #1E2A1E;
  --ink: #E2EBE2; --ink-mid: #9AAA98; --ink-muted: #6A806A; --ink-faint: #3A503A;
  --accent: #2FAA80; --accent-light: #0A2820;
  --flame: #E88030; --flame-bg: #281808; --flame-border: #6A3A10;
  --border: #283A28;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  padding: 28px 20px 56px;
  min-height: 100vh;
}
/* Header */
.hdr {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 28px;
}
.hdr-title {
  font-family: 'BIZ UDPMincho', serif;
  font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.2;
}
.hdr-sub { font-size: 12px; color: var(--ink-muted); margin-top: 3px; }
.hdr-right { text-align: right; }
.hdr-date { font-size: 12px; color: var(--ink-muted); }
.badge-updated {
  display: inline-block; margin-top: 5px;
  font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px;
  background: var(--flame-bg); color: var(--flame); border: 1px solid var(--flame-border);
}
/* Summary row */
.summary-row {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px;
}
.summary-chip {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1px solid transparent;
}
.chip-urgent { background: #FFF0EE; color: #B53020; border-color: #F0B0A8; }
.chip-wait   { background: #EEF6FF; color: #215E82; border-color: #A8CCEE; }
.chip-ceo    { background: #F0EAFF; color: #5820B4; border-color: #C4AAF0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip-urgent { background: #280A08; color: #FF9080; border-color: #6A2020; }
  :root:not([data-theme="light"]) .chip-wait   { background: #081828; color: #70B8E8; border-color: #204060; }
  :root:not([data-theme="light"]) .chip-ceo    { background: #180E30; color: #B090FF; border-color: #402878; }
}
:root[data-theme="dark"] .chip-urgent { background: #280A08; color: #FF9080; border-color: #6A2020; }
:root[data-theme="dark"] .chip-wait   { background: #081828; color: #70B8E8; border-color: #204060; }
:root[data-theme="dark"] .chip-ceo    { background: #180E30; color: #B090FF; border-color: #402878; }

/* Table */
.tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
table {
  width: 100%; border-collapse: collapse; min-width: 620px;
}
thead th {
  background: var(--surface2); padding: 10px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-muted); text-align: left; white-space: nowrap;
  border-bottom: 2px solid var(--border);
}
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
td { padding: 14px 14px; vertical-align: top; }
.td-name { min-width: 190px; }
.td-status { width: 130px; }
.td-detail { }
.td-action { min-width: 160px; }
.td-dl { width: 80px; white-space: nowrap; text-align: right; }

/* Row accent borders by group */
.row-urgent td:first-child { border-left: 3px solid #D05030; }
.row-wait   td:first-child { border-left: 3px solid #4090C0; }
.row-ceo    td:first-child { border-left: 3px solid #8050C0; }

/* Status badges */
.st {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 20px; white-space: nowrap;
}
.st-urgent { background: #FFF0EE; color: #B53020; border: 1px solid #F0B0A8; }
.st-inprog { background: #FFF8EE; color: #9A5C08; border: 1px solid #E8C888; }
.st-wait   { background: #EEF6FF; color: #215E82; border: 1px solid #A8CCEE; }
.st-ceo    { background: #F0EAFF; color: #5820B4; border: 1px solid #C4AAF0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .st-urgent { background:#280A08; color:#FF9080; border-color:#6A2020; }
  :root:not([data-theme="light"]) .st-inprog { background:#281408; color:#FFB060; border-color:#6A3A10; }
  :root:not([data-theme="light"]) .st-wait   { background:#081828; color:#70B8E8; border-color:#204060; }
  :root:not([data-theme="light"]) .st-ceo    { background:#180E30; color:#B090FF; border-color:#402878; }
}
:root[data-theme="dark"] .st-urgent { background:#280A08; color:#FF9080; border-color:#6A2020; }
:root[data-theme="dark"] .st-inprog { background:#281408; color:#FFB060; border-color:#6A3A10; }
:root[data-theme="dark"] .st-wait   { background:#081828; color:#70B8E8; border-color:#204060; }
:root[data-theme="dark"] .st-ceo    { background:#180E30; color:#B090FF; border-color:#402878; }

.pitch-name { font-weight: 600; font-size: 13.5px; color: var(--ink); }
.pitch-meta { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.detail-text { font-size: 13px; color: var(--ink-mid); }
.action-text { font-size: 12px; color: var(--ink-mid); }
.tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; margin-right: 4px; margin-top: 4px; }
.tag-coo  { background: var(--accent-light); color: var(--accent); }
.tag-niina { background: #E8F5E8; color: #2A6A2A; }
.tag-ceo  { background: #F0EAFF; color: #5820B4; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tag-niina { background: #082008; color: #60C060; }
  :root:not([data-theme="light"]) .tag-ceo   { background: #180E30; color: #B090FF; }
}
:root[data-theme="dark"] .tag-niina { background: #082008; color: #60C060; }
:root[data-theme="dark"] .tag-ceo   { background: #180E30; color: #B090FF; }

.dl-date { font-weight: 700; font-size: 13px; }
.dl-soon  { color: #B53020; }
.dl-mid   { color: #9A5C08; }
.dl-far   { color: var(--ink-muted); }
.dl-none  { color: var(--ink-faint); font-size: 12px; font-weight: 400; }
.dl-days  { display: block; font-size: 10px; font-weight: 400; color: var(--ink-faint); margin-top: 1px; }

/* Divider label */
.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-faint); padding: 8px 14px 4px; background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
/* Footer */
footer { margin-top: 32px; font-size: 11px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-title">アワード・ピッチ 進捗ダッシュボード</div>
    <div class="hdr-sub">次の灯株式会社</div>
  </div>
  <div class="hdr-right">
    <div class="hdr-date" id="js-date"></div>
    <div class="badge-updated" id="js-upd"></div>
  </div>
</div>

<div class="summary-row">
  <div class="summary-chip chip-urgent" id="cnt-urgent"></div>
  <div class="summary-chip chip-wait"   id="cnt-wait"></div>
  <div class="summary-chip chip-ceo"    id="cnt-ceo"></div>
</div>

<div class="tbl-wrap">
<table>
  <thead>
    <tr>
      <th class="td-name">ピッチ名</th>
      <th class="td-status">ステータス</th>
      <th class="td-detail">現在の状況</th>
      <th class="td-action">次のアクション</th>
      <th class="td-dl">締切</th>
    </tr>
  </thead>
  <tbody id="js-tbody"></tbody>
</table>
</div>

<footer id="js-footer"></footer>

<script>
var PITCHES = [
  {
    group: 'urgent',
    name: 'JVA — Japan Venture Awards 第26回',
    meta: '中小機構主催 / 経産省後援',
    status: 'urgent',
    stLabel: '緊急対応中',
    detail: '2次審査資料を作成中。COO最終確認依頼を提出済（9/15）。担当: 島津',
    tags: [['tag-niina', '島津担当'], ['tag-coo', 'COO確認済']],
    action: '資料を最終版に仕上げて提出',
    dl: '2026-09-24'
  },
  {
    group: 'urgent',
    name: 'Great Place to Work® 認定',
    meta: 'ランキング入り申請',
    status: 'inprog',
    stLabel: '資料作成中',
    detail: 'ランキング入りのための審査資料を作成中。',
    tags: [],
    action: '9/30までに申請資料を提出',
    dl: '2026-09-30'
  },
  {
    group: 'ceo',
    name: 'EY アントレプレナー・オブ・ザ・イヤー 2026',
    meta: 'EY Japan',
    status: 'ceo',
    stLabel: '🦄 CEO対応',
    detail: 'CEO対応フェーズ。準備・代表ピッチ手続きを進める段階。',
    tags: [['tag-ceo', '🦄 CEO担当']],
    action: 'CEO確認のうえエントリー提出',
    dl: '2026-10-16'
  },
  {
    group: 'wait',
    name: 'NIKKEI THE PITCH 2026–27',
    meta: '日本経済新聞社',
    status: 'wait',
    stLabel: '審査待ち',
    detail: 'エントリー済み。審査結果を待っている状態。',
    tags: [],
    action: '審査結果の連絡を待つ',
    dl: null
  },
  {
    group: 'wait',
    name: 'WE AT Challenge 2026 Track 1',
    meta: '',
    status: 'wait',
    stLabel: '審査待ち',
    detail: 'エントリー済み。審査結果を待っている状態。',
    tags: [],
    action: '審査結果の連絡を待つ',
    dl: null
  },
  {
    group: 'wait',
    name: '気候変動アクション',
    meta: '',
    status: 'wait',
    stLabel: '審査待ち',
    detail: 'エントリー済み。審査結果を待っている状態。',
    tags: [],
    action: '審査結果の連絡を待つ',
    dl: null
  }
];

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function formatDate(d) {
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function parseDL(s) {
  if (!s) return null;
  var p = s.split('-');
  var d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
  d.setHours(0,0,0,0);
  return d;
}

function dlClass(days) {
  if (days < 0) return 'dl-soon'; // overdue
  if (days <= 14) return 'dl-soon';
  if (days <= 30) return 'dl-mid';
  return 'dl-far';
}

function dlDateStr(s) {
  var p = s.split('-');
  return (parseInt(p[1])) + '/' + parseInt(p[2]);
}

var TODAY = new Date();
TODAY.setHours(0,0,0,0);

// Header date and badge
document.getElementById('js-date').textContent = formatDate(TODAY);
document.getElementById('js-upd').textContent = '本日更新';
document.getElementById('js-footer').textContent = '最終更新: ' + formatDate(TODAY) + ' — 次の灯株式会社';

// Summary counts
var cntUrgent = 0, cntWait = 0, cntCeo = 0;
for (var i = 0; i < PITCHES.length; i++) {
  var g = PITCHES[i].group;
  if (g === 'urgent') cntUrgent++;
  else if (g === 'wait') cntWait++;
  else if (g === 'ceo') cntCeo++;
}
document.getElementById('cnt-urgent').textContent = '対応中 ' + cntUrgent + '件';
document.getElementById('cnt-wait').textContent   = '審査待ち ' + cntWait + '件';
document.getElementById('cnt-ceo').textContent    = '🦄 CEO対応 ' + cntCeo + '件';

// Build rows
var tbody = document.getElementById('js-tbody');
var lastGroup = null;

var groupLabels = { urgent: '締切あり・対応中', wait: 'エントリー済・審査待ち', ceo: '🦄 CEO対応フェーズ' };

for (var j = 0; j < PITCHES.length; j++) {
  var p = PITCHES[j];

  // Section label row
  if (p.group !== lastGroup) {
    var labelRow = document.createElement('tr');
    var labelCell = document.createElement('td');
    labelCell.colSpan = 5;
    labelCell.className = 'section-label';
    labelCell.textContent = groupLabels[p.group];
    labelRow.appendChild(labelCell);
    tbody.appendChild(labelRow);
    lastGroup = p.group;
  }

  var dlDate = parseDL(p.dl);
  var daysLeft = dlDate ? Math.round((dlDate - TODAY) / 86400000) : null;

  // Status badge class
  var stClass = 'st-' + p.status;

  // Tags HTML
  var tagsHtml = '';
  for (var t = 0; t < p.tags.length; t++) {
    tagsHtml += '<span class="tag ' + p.tags[t][0] + '">' + p.tags[t][1] + '</span>';
  }

  // Deadline HTML
  var dlHtml = '';
  if (p.dl) {
    var dc = dlClass(daysLeft);
    var daysLabel = daysLeft < 0 ? '超過' : (daysLeft === 0 ? '本日' : daysLeft + '日後');
    dlHtml = '<span class="dl-date ' + dc + '">' + dlDateStr(p.dl) + '</span><span class="dl-days">(' + daysLabel + ')</span>';
  } else {
    dlHtml = '<span class="dl-none">未定</span>';
  }

  var tr = document.createElement('tr');
  tr.className = 'row-' + p.group;

  var td1 = document.createElement('td');
  td1.className = 'td-name';
  td1.innerHTML = '<div class="pitch-name">' + p.name + '</div>'
    + (p.meta ? '<div class="pitch-meta">' + p.meta + '</div>' : '');

  var td2 = document.createElement('td');
  td2.className = 'td-status';
  td2.innerHTML = '<span class="st ' + stClass + '">' + p.stLabel + '</span>';

  var td3 = document.createElement('td');
  td3.className = 'td-detail';
  td3.innerHTML = '<div class="detail-text">' + p.detail + '</div>'
    + (tagsHtml ? '<div>' + tagsHtml + '</div>' : '');

  var td4 = document.createElement('td');
  td4.className = 'td-action';
  td4.innerHTML = '<div class="action-text">' + p.action + '</div>';

  var td5 = document.createElement('td');
  td5.className = 'td-dl';
  td5.innerHTML = dlHtml;

  tr.appendChild(td1);
  tr.appendChild(td2);
  tr.appendChild(td3);
  tr.appendChild(td4);
  tr.appendChild(td5);
  tbody.appendChild(tr);
}
</script>
</body>
</html>
