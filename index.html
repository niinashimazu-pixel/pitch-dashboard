function formatDate(d) {
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function parseDL(s) {
  if (!s) return null;
  var p = s.split('-');
  var d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
  d.setHours(0,0,0,0);
  return d;
}
function dlClass(days) {
  if (days < 0) return 'dl-soon';
  if (days <= 14) return 'dl-soon';
  if (days <= 30) return 'dl-mid';
  return 'dl-far';
}
function dlDateStr(s) {
  var p = s.split('-');
  return (parseInt(p[1])) + '/' + parseInt(p[2]);
}

var TODAY = new Date();
TODAY.setHours(0,0,0,0);
document.getElementById('js-date').textContent = '本日: ' + formatDate(TODAY);

var counts = { urgent: 0, wait: 0, ceo: 0, hold: 0, unclear: 0 };
for (var i = 0; i < PITCHES.length; i++) counts[PITCHES[i].group]++;
document.getElementById('cnt-urgent').textContent  = '対応中 ' + counts.urgent + '件';
document.getElementById('cnt-ceo').textContent     = '🦄 CEO対応 ' + counts.ceo + '件';
document.getElementById('cnt-wait').textContent    = '審査待ち ' + counts.wait + '件';
document.getElementById('cnt-hold').textContent    = '保留中 ' + counts.hold + '件';
document.getElementById('cnt-unclear').textContent = '情報未整理 ' + counts.unclear + '件';

var tbody = document.getElementById('js-tbody');
var lastGroup = null;
var groupLabels = {
  urgent: '締切あり・対応中',
  ceo: '🦄 CEO対応フェーズ',
  wait: 'エントリー済・審査待ち',
  hold: '対応保留中',
  unclear: '情報未整理'
};

for (var j = 0; j < PITCHES.length; j++) {
  var p = PITCHES[j];

  if (p.group !== lastGroup) {
    var labelRow = document.createElement('tr');
    var labelCell = document.createElement('td');
    labelCell.colSpan = 5;
    labelCell.className = 'section-label';
    labelCell.textContent = groupLabels[p.group];
    labelRow.appendChild(labelCell);
    tbody.appendChild(labelRow);
    lastGroup = p.group;
  }

  var dlDate = p.dl ? parseDL(p.dl) : null;
  var daysLeft = dlDate ? Math.round((dlDate - TODAY) / 86400000) : null;
  var stClass = 'st-' + p.status;

  var tagsHtml = '';
  for (var t = 0; t < p.tags.length; t++) {
    tagsHtml += '<span class="tag ' + p.tags[t][0] + '">' + p.tags[t][1] + '</span>';
  }

  var dlHtml = '';
  if (p.dlType === 'none' || !p.dl) {
    dlHtml = '<span class="dl-none">未定</span>';
  } else {
    var dc = dlClass(daysLeft);
    var pClass = dc === 'dl-soon' ? 'p-soon' : dc === 'dl-mid' ? 'p-mid' : 'p-far';
    var daysLabel = daysLeft < 0 ? '経過（要確認）' : (daysLeft === 0 ? '本日' : 'あと' + daysLeft + '日');
    var fillPct = daysLeft < 0 ? 100 : Math.max(6, Math.min(100, Math.round(100 - (daysLeft / 60 * 100))));
    dlHtml = '<div class="dl-pill ' + pClass + '">'
           + '<span class="dl-date ' + dc + '">' + dlDateStr(p.dl) + '</span>'
           + '<span class="dl-days">(' + daysLabel + ')</span>'
           + (p.dlLabel ? '<span class="dl-label">' + p.dlLabel + '</span>' : '')
           + '<div class="urg-track"><div class="urg-fill ' + pClass + '" style="width:' + fillPct + '%"></div></div>'
           + '</div>';
  }

  var stepperHtml = '';
  if (p.stages && p.stages.length) {
    var parts = [];
    var curLabel = '', curPaused = false;
    for (var s = 0; s < p.stages.length; s++) {
      var st = p.stages[s];
      if (s > 0) {
        var prevDone = p.stages[s-1].s === 'done';
        parts.push('<span class="sm-line' + (prevDone ? ' done' : '') + '"></span>');
      }
      parts.push('<span class="sm-step ' + st.s + '" title="' + st.t + '"><span class="sm-dot"></span></span>');
      if (st.s === 'current' || st.s === 'paused') { curLabel = st.t; curPaused = st.s === 'paused'; }
    }
    stepperHtml = '<div class="stepper-mini">' + parts.join('')
      + (curLabel ? '<span class="sm-current-label' + (curPaused ? ' paused' : '') + '">' + curLabel + '</span>' : '')
      + '</div>';
  }

  var tr = document.createElement('tr');
  tr.className = 'row-' + p.group;

  var td1 = document.createElement('td');
  td1.className = 'td-name';
  td1.innerHTML = '<div class="pitch-name">' + p.name + '</div>'
    + (p.meta ? '<div class="pitch-meta">' + p.meta + '</div>' : '');

  var td2 = document.createElement('td');
  td2.className = 'td-status';
  td2.innerHTML = '<span class="st ' + stClass + '">' + p.stLabel + '</span>';

  var td3 = document.createElement('td');
  td3.className = 'td-detail';
  td3.innerHTML = '<div class="detail-text">' + p.detail + '</div>'
    + (tagsHtml ? '<div>' + tagsHtml + '</div>' : '')
    + stepperHtml;

  var td4 = document.createElement('td');
  td4.className = 'td-action';
  td4.innerHTML = '<div class="action-text">' + p.action + '</div>';

  var td5 = document.createElement('td');
  td5.className = 'td-dl';
  td5.innerHTML = dlHtml;

  tr.appendChild(td1);
  tr.appendChild(td2);
  tr.appendChild(td3);
  tr.appendChild(td4);
  tr.appendChild(td5);
  tbody.appendChild(tr);
}
</script>
</body>
</html>
